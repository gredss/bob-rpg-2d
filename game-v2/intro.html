<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    LEGACY — intro.html (mission brief / scenario intro screen)
    ------------------------------------------------------------
    This screen was designed as a pre-game briefing before scene.html.
    It is no longer part of the main flow and nothing currently links to it.
    Keep for reference or restore by linking from bob-role-pick.html → intro.html → scene.html.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTE FORCE — Mission Brief (Legacy)</title>
  <link rel="icon" type="image/jpeg" href="assets/byte-force-logo.jpg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body>
  <div class="page" style="overflow-y:auto;align-items:center;justify-content:flex-start;">
    <button class="home-btn" onclick="location.href='index.html'" title="Home">
      <img src="assets/home.png" alt="Home">
    </button>
    <div class="stars" id="stars"></div>

    <div class="intro-wrap">
      <div class="intro-chapter" id="intro-chapter">NEW PROJECT</div>
      <h1 class="intro-title" id="intro-title">Loading…</h1>
      <div class="intro-client" id="intro-client"></div>

      <div class="intro-brief" id="intro-brief"></div>

      <div class="intro-team-label">YOUR TEAM</div>
      <div class="intro-team" id="intro-team"></div>

      <div class="intro-timer-note">
        Client demo in <strong>10:00</strong> — work fast, work smart.
      </div>

      <button class="intro-btn" id="btn-begin">Begin Mission →</button>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/scenarios.js"></script>
  <script>
    // Build stars
    (function() {
      const c = document.getElementById('stars');
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('span');
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.5};`;
        c.appendChild(s);
      }
    })();

    const s = State.get();
    if (!s.scenarioId) { location.href = 'index.html'; }

    const scenario = SCENARIOS[s.scenarioId];

    // Populate
    document.getElementById('intro-title').textContent  = scenario.title;
    document.getElementById('intro-client').textContent = scenario.client;
    document.getElementById('intro-brief').textContent  = scenario.brief;

    // Team roster
    const teamOrder = ['pm','ux','frontend','backend','data','qa','devops','security'];
    const teamEl = document.getElementById('intro-team');
    const HEAD_FILES = {
      pm: 'assets/product-manager/head-only.png',
      ux: 'assets/ux-designer/head.png',
      frontend: 'assets/frontend-dev/head.png',
      backend: 'assets/backend-dev/head.png',
      data: 'assets/data-scientist/head.png',
      qa: 'assets/qa-engineer/head.png',
      devops: 'assets/devops-engineer/head.png',
      security: 'assets/cybersec-engineer/head.png',
    };
    teamOrder.forEach(id => {
      const char = CHARACTERS[id];
      if (!char) return;
      const headSrc = HEAD_FILES[id] || '';
      const div = document.createElement('div');
      div.className = 'intro-member';
      div.innerHTML = `
        <img class="intro-member-head" src="${headSrc}" alt="${char.name}" onerror="this.style.display='none'">
        <span class="intro-member-name">${char.name.split(' ')[0]}</span>
        <span class="intro-member-role">${char.role}</span>
      `;
      teamEl.appendChild(div);
    });

    document.getElementById('btn-begin').addEventListener('click', () => {
      location.href = 'scene.html';
    });
  </script>
</body>
</html>
