<section class="home-page">

  <!-- Decorative 3D image layers (right-side background) -->

    <img src="asset/IBM_Bob_3D_UI_black.png" alt="" class="home-bg-img" />
  </div>
  <div class="home-img-boost" aria-hidden="true">
    <img src="asset/IBM_Bob_3D_UI_black.png" alt="" class="home-bg-img-boost-img" />
  </div>

  <!-- Landing content -->

    <!-- Brand mark -->
    <div class="home-brand">
      <img src="asset/IBM_Bob_hero_illustration_head_color.svg" alt="IBM Bob" class="home-brand-logo" />

    <p class="home-subtitle">

      <button type="button" class="home-stage-btn" data-page="mcp">
        <span class="hsb-dot"></span>
        <span class="hsb-body">
          <span class="hsb-name">MCP</span>
          <span class="hsb-desc">Connect Bob to your real tools &amp; systems</span>
        </span>
        <span class="hsb-arrow">›</span>
      </button>
      <button type="button" class="home-stage-btn" data-page="modes">
        <span class="hsb-dot"></span>
        <span class="hsb-body">
          <span class="hsb-name">Modes</span>
          <span class="hsb-desc">Bob adapts to every role &amp; workflow</span>
        </span>
        <span class="hsb-arrow">›</span>
      </button>
      <button type="button" class="home-stage-btn" data-page="cli">
        <span class="hsb-dot"></span>
        <span class="hsb-body">
          <span class="hsb-name">Bob Shell</span>
          <span class="hsb-desc">Bring agents to your command line &amp; CI/CD</span>
        </span>
        <span class="hsb-arrow">›</span>
      </button>
      <button type="button" class="home-stage-btn" data-page="security">
        <span class="hsb-dot"></span>
        <span class="hsb-body">
          <span class="hsb-name">Security</span>
          <span class="hsb-desc">Shift-left security embedded across every stage</span>
        </span>
        <span class="hsb-arrow">›</span>
      </button>
      <button type="button" class="home-stage-btn" data-page="enterprise">
        <span class="hsb-dot"></span>
        <span class="hsb-body">
          <span class="hsb-name">Enterprise</span>
          <span class="hsb-desc">Bobcoin pooling, Bobalytics &amp; org-wide control</span>
        </span>
        <span class="hsb-arrow">›</span>
      </button>
    </nav>

  </div><!-- /home-content -->

  <!-- Preview card — fades in on stage hover -->
  <div class="home-preview" id="home-preview" aria-live="polite">
    <div class="hp-header">
      <span class="hp-num"   id="hp-num"></span>
      <span class="hp-stage" id="hp-stage"></span>
      <span class="hp-tag"   id="hp-tag"></span>
    </div>
    <p class="hp-desc" id="hp-desc"></p>
    <ul class="hp-bullets" id="hp-bullets"></ul>
    <div class="hp-media">
      <img class="hp-gif" id="hp-gif" src="" alt="" />
      <div class="hp-gif-placeholder" id="hp-placeholder">
        <span class="hp-placeholder-label" id="hp-placeholder-label">Demo preview</span>
      </div>
    </div>
    <button type="button" class="hp-cta" id="hp-cta">Enter stage <span>→</span></button>
  </div>

  <script data-page-script src="js/pages/home.js"></script>
