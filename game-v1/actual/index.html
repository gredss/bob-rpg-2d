<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IBM Bob — AI-Powered Full SDLC Developer Assistant demo. Plan, code, review, deploy and monitor with Bob." />
    <title>IBM Bob — Full SDLC Demo</title>

    <!-- DNS prefetch for Google Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
    />

    <!-- Core styles -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/back-to-game.css" />
  </head>

  <body>
    <!-- ── Theme toggle ───────────────────────────────────────── -->
    <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle theme">
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun"  width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <!-- ── Top navigation bar ─────────────────────────────────────────── -->
    <header id="top-nav" class="nav-hidden">
      <div class="nav-brand">
        <img src="asset/IBM_Bob_logotype_rev_white_RGB.png" alt="IBM Bob" class="nav-logotype" />
      </div>

      <nav class="nav-stages" aria-label="IBM Bob USPs">
        <button type="button" class="stage-btn" data-page="mcp">MCP</button>
        <span class="stage-sep">·</span>
        <button type="button" class="stage-btn" data-page="modes">Modes</button>
        <span class="stage-sep">·</span>
        <button type="button" class="stage-btn" data-page="cli">CLI</button>
        <span class="stage-sep">·</span>
        <button type="button" class="stage-btn" data-page="security">Security</button>
        <span class="stage-sep">·</span>
        <button type="button" class="stage-btn" data-page="enterprise">Enterprise</button>
      </nav>
    </header>
    <div id="nav-spacer"></div>

    <!-- ── Page viewport ──────────────────────────────────────────────── -->
    <main id="page-view"></main>

    <!-- ── Back-to-game portal — bottom-left corner sweep ── -->
    <div class="game-portal" id="game-portal">
      <iframe
        src="../index.html"
        class="game-portal-iframe"
        id="game-portal-iframe"
        tabindex="-1"
        title="BYTE FORCE Game"
        scrolling="no">
      </iframe>
      <div class="game-portal-overlay">
        <span class="game-portal-hint">← Click to play BYTE FORCE</span>
      </div>
    </div>

    <!-- ── Scripts — load order matters ─────────────────────────────── -->
    <script defer src="js/router.js"></script>
    <script defer src="js/chat.js"></script>
    <script defer src="js/chat-helpers.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/theme.js"></script>
  </body>
</html>
