<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBM Bob — VP Story</title>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <!-- ── Game HUD bar ── -->
    <div class="ds-hud">
      <div class="ds-hud-left">
        <img src="../assets/bob/head.png"
             alt="BYTE FORCE"
             class="ds-hud-logo"
             onclick="location.href='../scene-vp.html'"
             title="Back to game"
             role="button" />
      </div>
    </div>

    <!-- ── Bob chatbox layout ── -->
    <section class="bcp-page bcp-page--split" id="chat-view">

      <!-- VS Code Explorer panel -->
      <div class="bcp-explorer">
        <div class="bcp-exp-header">
          <span class="bcp-exp-title">EXPLORER</span>
          <button type="button" class="bcp-exp-more" title="More actions">···</button>
        </div>
        <div class="bcp-exp-tree">
          <div class="bcp-exp-root">
            <span class="bcp-exp-arrow bcp-exp-arrow--open">&#8964;</span>
            <span class="bcp-exp-root-name">BOARD MEETING / Q3</span>
          </div>
        </div>
        <div class="bcp-exp-section">
          <span class="bcp-exp-section-arrow">›</span>
          <span class="bcp-exp-section-label">OUTLINE</span>
        </div>
        <div class="bcp-exp-section">
          <span class="bcp-exp-section-arrow">›</span>
          <span class="bcp-exp-section-label">TIMELINE</span>
        </div>
      </div>

      <!-- ── MD viewer panel (hidden until a .md file is clicked) ── -->
      <div class="bcp-md-panel hidden" id="bcp-md-panel">
        <div class="bcp-md-tabbar">
          <div class="bcp-md-tab">
            <span class="bcp-md-tab-icon">&#128196;</span>
            <span class="bcp-md-tab-name" id="bcp-md-tab-name">board-insights.md</span>
            <button type="button" class="bcp-md-tab-close" id="bcp-md-close">&#10005;</button>
          </div>
        </div>
        <div class="bcp-md-breadcrumb">
          <span class="bcp-md-bc-icon">&#128196;</span>
          <span id="bcp-md-bc-name">board-insights.md</span>
        </div>
        <div class="bcp-md-body" id="bcp-md-body"></div>
      </div>
      <!-- Resize handle for MD panel -->
      <div class="bcp-resize-handle bcp-md-resize-handle" id="bcp-md-resize-handle"></div>

      <!-- Bob chatbox -->
      <div class="bcp-chat-col">
        <div class="bcp-topbar">
          <span class="bcp-topbar-title">IBM BOB</span>
          <div class="bcp-topbar-actions">
            <button type="button" class="bcp-icon-btn" title="Settings">⚙</button>
            <button type="button" class="bcp-icon-btn" title="Task list">☰</button>
            <button type="button" class="bcp-icon-btn" title="New task">＋</button>
            <button type="button" class="bcp-icon-btn" title="More">···</button>
            <div class="bcp-topbar-sep"></div>
            <button type="button" class="bcp-icon-btn" title="Open in editor">⤢</button>
            <button type="button" class="bcp-icon-btn" title="Close">✕</button>
          </div>
        </div>

        <div class="bcp-body" id="bcp-body">
          <div class="bcp-welcome" id="bcp-welcome">
            <div class="bcp-welcome-avatar-wrap">
              <img src="../actual_2/asset/IBM_Bob_hero_illustration_half_body_color.svg" alt="IBM Bob" class="bcp-welcome-avatar" />
            </div>
            <h2 class="bcp-welcome-title">Hi, I'm <span>Bob</span></h2>
            <p class="bcp-welcome-sub">I can help you analyse, synthesise, and decide — faster.</p>
            <button type="button" class="bcp-doc-btn">Documentation</button>
          </div>
          <div class="bcp-messages" id="bcp-messages"></div>
        </div>

        <div class="bcp-inputbar">
          <div class="bcp-input-box" id="bcp-input-box">
            <div class="bcp-scripted-input" id="bcp-scripted-input"></div>
          </div>
          <div class="bcp-input-footer">
            <div class="bcp-footer-left">
              <button type="button" class="bcp-pill">＋</button>
              <button type="button" class="bcp-pill bcp-pill--mode">&#9654; Agent ▾</button>
              <button type="button" class="bcp-pill">Permissions ▾</button>
            </div>
            <button type="button" class="bcp-send pulse" id="bcp-send">↑</button>
          </div>
        </div>
      </div>
    </section>

  <script src="js/demo.js"></script>
  </body>
</html>
