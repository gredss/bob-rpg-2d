<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTE FORCE — Choose Your Role</title>
  <link rel="icon" type="image/jpeg" href="assets/byte-force-logo.jpg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/role-pick.css">
</head>
<body>
  <div class="page" style="overflow-y:auto;align-items:center;justify-content:flex-start;">
    <button class="home-btn" id="home-btn" title="Home">
      <img src="assets/home.png" alt="Home">
    </button>

    <!-- Language toggle — top right -->
    <div class="lang-toggle" id="lang-toggle">
      <button class="lang-btn active" id="btn-en">EN</button>
      <span class="lang-divider">|</span>
      <button class="lang-btn" id="btn-id">ID</button>
    </div>

    <div class="stars" id="stars"></div>

    <div class="role-pick-wrap">
      <div class="role-pick-eyebrow">
        <img src="assets/byte-force-logo.jpg" alt="BYTE FORCE" class="byteforce-logo">
      </div>
      <h1 class="role-pick-title" id="pick-title">Choose Your Role</h1>
      <p class="role-pick-sub" id="pick-sub">Pick a role. Face its real problems. See how Bob helps.</p>
      <div class="role-grid" id="role-grid"></div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/sfx.js"></script>
  <script>
    // ── Role definitions (4 roles only) ─────────────────────────────────────────
    const ROLES = [
      {
        id:        'vp',
        headFile:  'assets/product-manager/head-only.png',
        bodyFile:  'assets/product-manager/full-body.png',
        bg:        'assets/background/MEETING-ROOM.jpg',
        en: {
          name:  'Alex Chen',
          role:  'VP / Director',
          brief: 'Three proposals. One board meeting. 45 minutes to make the call.',
        },
        id_: {
          name:  'Alex Chen',
          role:  'VP / Direktur',
          brief: 'Tiga proposal. Satu rapat dewan. 45 menit untuk mengambil keputusan.',
        },
      },
      {
        id:        'headit',
        headFile:  'assets/devops-engineer/head.png',
        bodyFile:  'assets/devops-engineer/full-body.png',
        bg:        'assets/background/SERVER-ROOM.jpg',
        en: {
          name:  'Taylor Kim',
          role:  'Head IT',
          brief: 'Every team is asking. Nothing is documented. One person can\'t scale alone.',
        },
        id_: {
          name:  'Taylor Kim',
          role:  'Kepala IT',
          brief: 'Semua tim bertanya. Tidak ada dokumentasi. Satu orang tidak bisa menanggung semuanya.',
        },
      },
      {
        id:        'developer',
        headFile:  'assets/backend-dev/head.png',
        bodyFile:  'assets/backend-dev/full-body.png',
        bg:        'assets/background/DEV-DESK.jpg',
        en: {
          name:  'Sam Rivera',
          role:  'Developer',
          brief: 'Unfamiliar API. VP demo tomorrow. No time to read 200 pages of docs.',
        },
        id_: {
          name:  'Sam Rivera',
          role:  'Developer',
          brief: 'API yang belum dikenal. Demo VP besok. Tidak ada waktu baca 200 halaman dokumentasi.',
        },
      },
      {
        id:        'analyst',
        headFile:  'assets/data-scientist/head.png',
        bodyFile:  'assets/data-scientist/full-body.png',
        bg:        'assets/background/DATA-LAB.jpg',
        en: {
          name:  'Priya Nair',
          role:  'Data Analyst',
          brief: '40 columns of raw data. One integration job. Deadline is tomorrow morning.',
        },
        id_: {
          name:  'Priya Nair',
          role:  'Analis Data',
          brief: '40 kolom data mentah. Satu integration job. Deadline besok pagi.',
        },
      },
    ];

    // ── i18n strings ─────────────────────────────────────────────────────────────
    const I18N = {
      en: { title: 'Choose Your Role', sub: 'Pick a role. Face its real problems. See how Bob helps.' },
      id: { title: 'Pilih Peranmu',    sub: 'Pilih peran. Hadapi masalah nyata. Lihat bagaimana Bob membantu.' },
    };

    // ── Language state ───────────────────────────────────────────────────────────
    let currentLang = sessionStorage.getItem('byteforce_lang') || 'en';

    function setLang(lang) {
      currentLang = lang;
      sessionStorage.setItem('byteforce_lang', lang);
      applyLang();
    }

    function applyLang() {
      const t = I18N[currentLang];
      document.getElementById('pick-title').textContent = t.title;
      document.getElementById('pick-sub').textContent   = t.sub;
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('btn-id').classList.toggle('active', currentLang === 'id');
      document.documentElement.lang = currentLang;
      renderCards();
    }

    // ── SFX: page load ───────────────────────────────────────────────────────────
    window.addEventListener('load', () => SFX.play('pageLoad', { volume: 0.6 }));

    // ── Stars ────────────────────────────────────────────────────────────────────
    (function () {
      const c = document.getElementById('stars');
      for (let i = 0; i < 55; i++) {
        const s = document.createElement('span');
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.5};`;
        c.appendChild(s);
      }
    })();

    // ── Render role cards ────────────────────────────────────────────────────────
    function renderCards() {
      const grid = document.getElementById('role-grid');
      grid.innerHTML = '';

      ROLES.forEach((role, i) => {
        const strings = currentLang === 'en' ? role.en : role.id_;
        const card = document.createElement('button');
        card.className = 'role-card';
        card.style.setProperty('--float-delay', `${i * 1.25}s`);
        card.style.animationDelay = `${i * 0.07}s, ${i * 1.25}s`;
        card.innerHTML = `
          <div class="role-card-scene" style="background-image:url('${role.bg}')">
            <img class="role-card-sprite" src="${role.bodyFile}" alt="${strings.name}">
          </div>
          <div class="role-card-body">
            <div class="role-card-name">${strings.name}</div>
            <div class="role-card-role">${strings.role}</div>
            <div class="role-card-brief">${strings.brief}</div>
          </div>
        `;
        card.addEventListener('mouseenter', () => SFX.play('cardHover', { debounce: true }));
        card.addEventListener('click', () => {
          State.reset();
          State.set({
            roleId:     role.id,
            sceneIndex: 0,
            metrics:    { quality: 100, security: 100, satisfaction: 100, cost: 0 },
            bobCount:   0,
            totalTasks: 0,
            timeSaved:  0,
            startedAt:  Date.now(),
            timerLeft:  600,
          });
          const dest = {
            analyst:   'scene-analyst.html',
            developer: 'scene-developer.html',
            headit:    'scene-headit.html',
            vp:        'scene-vp.html',
          }[role.id] || 'scene.html';
          SFX.playThen('roleSelect', () => { location.href = dest; });
        });
        grid.appendChild(card);
      });
    }

    // ── Wire language buttons ────────────────────────────────────────────────────
    document.getElementById('btn-en').addEventListener('click', () => { SFX.play('btnClick', { volume: 0.5 }); setLang('en'); });
    document.getElementById('btn-id').addEventListener('click', () => { SFX.play('btnClick', { volume: 0.5 }); setLang('id'); });

    // ── Wire home button ─────────────────────────────────────────────────────────
    document.getElementById('home-btn').addEventListener('click', () => {
      SFX.playThen('homeBtn', () => { location.href = 'index.html'; });
    });

    // ── Init ─────────────────────────────────────────────────────────────────────
    applyLang();
  </script>
</body>
</html>
