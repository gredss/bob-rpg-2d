<section class="bcp-page">
  <div class="bcp-topbar">
    <span class="bcp-topbar-title">IBM BOB</span>
    <div class="bcp-topbar-actions">
      <button type="button" class="bcp-icon-btn" title="Settings">⚙</button>
      <button type="button" class="bcp-icon-btn" title="Task list">☰</button>
      <button type="button" class="bcp-icon-btn" title="New task">＋</button>
      <button type="button" class="bcp-icon-btn" title="More">···</button>
      <div class="bcp-topbar-sep"></div>
      <button type="button" class="bcp-icon-btn" title="Open in editor">⤢</button>
      <button type="button" class="bcp-icon-btn" title="Close">✕</button>
    </div>
  </div>
  <div class="bcp-body" id="bcp-body">
    <div class="bcp-welcome" id="bcp-welcome">
      <div class="bcp-welcome-avatar-wrap">
        <img src="asset/IBM_Bob_hero_illustration_half_body_color.svg" alt="IBM Bob" class="bcp-welcome-avatar" />
      </div>
      <h2 class="bcp-welcome-title">Hi, I'm <span>Bob</span></h2>
      <p class="bcp-welcome-sub">Ask me questions or let me code for you.</p>
      <button type="button" class="bcp-doc-btn">📖 Documentation</button>
    </div>
    <div class="bcp-messages" id="bcp-messages"></div>
  </div>
  <div class="bcp-inputbar">
    <div class="bcp-input-box" id="bcp-input-box">
      <div class="bcp-scripted-input" id="bcp-scripted-input"></div>
    </div>
    <div class="bcp-input-footer">
      <div class="bcp-footer-left">
        <button type="button" class="bcp-pill">＋</button>
        <button type="button" class="bcp-pill">🤖 Agent ▾</button>
        <button type="button" class="bcp-pill">🔒 Permissions ▾</button>
      </div>
      <button type="button" class="bcp-send" id="bcp-send">↑</button>
    </div>
  </div>
</section>
<script data-page-script src="js/pages/review.js"></script>
