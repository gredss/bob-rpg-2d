<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTE FORCE — Powered by Bob</title>
  <link rel="icon" type="image/jpeg" href="assets/byte-force-logo.jpg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/attract.css">
</head>
<body>
  <div class="page attract-page">
    <div class="stars" id="stars"></div>

    <!-- ── Two-column layout ──────────────────────────────────────────────── -->
    <div class="attract-layout">

      <!-- Left: Bob full body + speech bubble -->
      <div class="attract-bob-col">
        <img src="assets/bubble.png" alt="" class="attract-bubble">
        <img src="assets/bob/full-body.png" alt="Bob" class="attract-bob-body">
      </div>

      <!-- Right: all content -->
      <div class="attract-content-col">
        <img src="assets/IBM_Bob_logotype_rev_white_RGB.png" alt="IBM Bob" class="attract-ibm-bob-logo">

        <div class="attract-logo-wrap">
          <img src="assets/byte-force-logo.jpg" alt="BYTE FORCE" class="attract-logo">
        </div>

        <div class="attract-divider"></div>

        <p class="attract-tagline">Plan. Build. Test. Secure. Deploy.</p>
        <p class="attract-tagline2">See how Bob supports every step of the software lifecycle.</p>

        <div class="attract-divider"></div>

        <button class="attract-cta" id="btn-start">
          <img src="assets/start.png" alt="Click to Start" class="attract-cta-img">
        </button>
      </div>

    </div>

  </div>

  <!-- ── IBM Bob portal — full-screen iframe, swept in from bottom-right ── -->
  <div class="bob-portal" id="bob-portal">
    <iframe
      src="actual/index.html"
      class="bob-portal-iframe"
      id="bob-portal-iframe"
      tabindex="-1"
      title="IBM Bob — Full SDLC Demo"
      allowfullscreen>
    </iframe>
    <button class="bob-portal-close" id="btn-portal-close" title="Back to game (Esc)">
      <div class="bob-portal-close-inner">
        <img src="assets/bob/head.png" alt="Bob" class="bob-portal-close-avatar">
        <div class="bob-portal-close-body">
          <span class="bob-portal-close-eyebrow">BYTE FORCE</span>
          <span class="bob-portal-close-title">Back to game</span>
          <span class="bob-portal-close-cta"><span class="bob-portal-close-arrow">←</span> Return to play</span>
        </div>
      </div>
    </button>
  </div>

  <!-- ── IBM Bob card trigger — always visible bottom-right ── -->
  <button class="bob-learn-btn" id="btn-learn" title="Learn about IBM Bob">
    <div class="bob-learn-inner">
      <img src="actual/asset/IBM_Bob_hero_illustration_head_color.svg" alt="Bob" class="bob-learn-avatar">
      <div class="bob-learn-body">
        <span class="bob-learn-eyebrow">IBM Bob · SDLC Demo</span>
        <span class="bob-learn-title">See Bob in action</span>
        <span class="bob-learn-cta">Explore the demo <span class="bob-learn-arrow">→</span></span>
      </div>
    </div>
  </button>

  <script src="js/state.js"></script>
  <script src="js/sfx.js"></script>
  <script>
    // Stars
    (function() {
      const c = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('span');
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.5};`;
        c.appendChild(s);
      }
    })();

    // ── SFX: page load ───────────────────────────────────────────────────────
    window.addEventListener('load', () => SFX.play('pageLoad', { volume: 0.6 }));

    State.reset();

    // ── SFX: start button ────────────────────────────────────────────────────
    const btnStart = document.getElementById('btn-start');
    btnStart.addEventListener('mouseenter', () => SFX.play('cardHover', { debounce: true }));
    btnStart.addEventListener('click', () => {
      SFX.playThen('btnClick', () => { location.href = 'bob-role-pick.html'; });
    });

    // ── Portal: iframe-based switch ──────────────────────────────────────────
    const portal   = document.getElementById('bob-portal');
    const iframe   = document.getElementById('bob-portal-iframe');
    const pill     = document.getElementById('btn-learn');
    const closeBtn = document.getElementById('btn-portal-close');
    let closeTimer = null;
    let isFullyOpen = false;
    let portalPage = 'home';

    function setPortalPage(page) {
      portalPage = page;
      portal.dataset.portalPage = page;
    }
    setPortalPage('home');

    function peekPortal() {
      if (isFullyOpen) return;
      clearTimeout(closeTimer);
      portal.classList.add('open');
    }
    function schedulePeekClose() {
      if (isFullyOpen) return;
      closeTimer = setTimeout(() => portal.classList.remove('open'), 80);
    }
    function switchIn() {
      clearTimeout(closeTimer);
      isFullyOpen = true;
      portal.classList.add('open', 'full');
      pill.classList.add('hidden-by-switch');
      try {
        const p = iframe.contentWindow && iframe.contentWindow.Router && iframe.contentWindow.Router.current;
        if (p) setPortalPage(p);
      } catch (e) {}
      closeBtn.hidden = portalPage !== 'home';
    }
    function switchOut() {
      isFullyOpen = false;
      portal.classList.remove('full');
      setTimeout(() => portal.classList.remove('open'), 550);
      pill.classList.remove('hidden-by-switch');
      closeBtn.hidden = true;
    }
    function updatePortalCloseButtonVisibility(page) {
      setPortalPage(page);
      closeBtn.hidden = !isFullyOpen || page !== 'home';
    }

    pill.addEventListener('mouseenter', () => { if (!isFullyOpen) peekPortal(); });
    pill.addEventListener('mouseleave', () => { if (!isFullyOpen) schedulePeekClose(); });
    pill.addEventListener('click',      () => { if (!isFullyOpen) switchIn(); });
    closeBtn.addEventListener('click',  (e) => { e.stopPropagation(); if (isFullyOpen) switchOut(); });
    window.addEventListener('message',  (e) => {
      if (e.data && e.data.type === 'bob:page-change') updatePortalCloseButtonVisibility(e.data.page);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isFullyOpen) switchOut(); });
    closeBtn.hidden = true;
  </script>
</body>
</html>
