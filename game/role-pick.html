<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTE FORCE — Choose Your Role</title>
  <link rel="icon" type="image/jpeg" href="assets/byte-force-logo.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="assets/byte-force-logo.jpg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/role-pick.css">
</head>
<body>
  <div class="page" style="overflow-y:auto;align-items:center;justify-content:flex-start;">
    <button class="home-btn" onclick="location.href='index.html'" title="Home">
      <img src="assets/home.png" alt="Home">
    </button>

    <!-- Language toggle — top right -->
    <div class="lang-toggle" id="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <span class="lang-divider">|</span>
      <button class="lang-btn" id="btn-id" onclick="setLang('id')">ID</button>
    </div>

    <div class="stars" id="stars"></div>

    <div class="role-pick-wrap">
      <div class="role-pick-eyebrow">BYTE FORCE</div>
      <h1 class="role-pick-title" id="pick-title">Choose Your Role</h1>
      <p class="role-pick-sub" id="pick-sub">Pick a role. Face its real problems. See how Bob helps.</p>
      <div class="role-grid" id="role-grid"></div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/role-scenarios.js"></script>
  <script>
    // ── i18n strings ────────────────────────────────────────────────────────────
    const I18N = {
      en: {
        title:  'Choose Your Role',
        sub:    'Pick a role. Face its real problems. See how Bob helps.',
        roles: {
          data:     { role: 'Data Scientist',      brief: 'Raw data in. Insights out. Fix the model before the client demo.',             ws: 'Jupyter Notebook' },
          frontend: { role: 'Frontend Dev',        brief: 'The design just landed. The API is half-broken. Ship it anyway.',              ws: 'Code Editor'      },
          backend:  { role: 'Backend Dev',         brief: 'The API is down, the spec is wrong, and the auth is leaking. Fix all three.',  ws: 'API Console'      },
          pm:       { role: 'Product Manager',     brief: 'Three stakeholders. Two deadlines. One sprint. Make it work.',                 ws: 'Product Dashboard' },
          ux:       { role: 'UX Designer',         brief: 'The brief is vague, the contrast fails, and dev ships tomorrow. Design it right.', ws: 'Design Canvas' },
          qa:       { role: 'QA Engineer',         brief: "Three test cases for a banking system. That's not enough. Fix it before it ships.", ws: 'Test Runner'   },
          devops:   { role: 'DevOps / MLOps',      brief: 'The container crashed, the secret is missing, and the health check is lying. Ship it.', ws: 'CI/CD Pipeline' },
          security: { role: 'Cybersecurity',       brief: 'Secret in git. PII exposed. JWT crackable. Fix all three before the client audit.', ws: 'Security Scanner' },
        },
      },
      id: {
        title:  'Pilih Peranmu',
        sub:    'Pilih peran. Hadapi masalah nyata. Lihat bagaimana Bob membantu.',
        roles: {
          data:     { role: 'Ilmuwan Data',        brief: 'Data mentah masuk. Insight keluar. Perbaiki model sebelum demo klien.',         ws: 'Jupyter Notebook' },
          frontend: { role: 'Frontend Dev',        brief: 'Desain baru datang. API setengah rusak. Kirim tetap.',                          ws: 'Code Editor'      },
          backend:  { role: 'Backend Dev',         brief: 'API mati, spesifikasi salah, dan autentikasi bocor. Perbaiki ketiganya.',        ws: 'Konsol API'       },
          pm:       { role: 'Manajer Produk',      brief: 'Tiga pemangku kepentingan. Dua tenggat. Satu sprint. Buat berhasil.',           ws: 'Dasbor Produk'    },
          ux:       { role: 'Desainer UX',         brief: 'Brief tidak jelas, kontras gagal, dan dev kirim besok. Desain yang benar.',     ws: 'Kanvas Desain'    },
          qa:       { role: 'QA Engineer',         brief: 'Tiga kasus uji untuk sistem perbankan. Tidak cukup. Perbaiki sebelum dirilis.', ws: 'Test Runner'      },
          devops:   { role: 'DevOps / MLOps',      brief: 'Container crash, secret hilang, health check berbohong. Kirim tetap.',          ws: 'Pipeline CI/CD'   },
          security: { role: 'Keamanan Siber',      brief: 'Secret di git. PII terekspos. JWT bisa diretas. Perbaiki sebelum audit klien.', ws: 'Pemindai Keamanan' },
        },
      },
    };

    // ── Language state ───────────────────────────────────────────────────────────
    let currentLang = sessionStorage.getItem('byteforce_lang') || 'en';

    function setLang(lang) {
      currentLang = lang;
      sessionStorage.setItem('byteforce_lang', lang);
      applyLang();
    }

    function applyLang() {
      const t = I18N[currentLang];
      document.getElementById('pick-title').textContent = t.title;
      document.getElementById('pick-sub').textContent   = t.sub;
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('btn-id').classList.toggle('active', currentLang === 'id');
      document.documentElement.lang = currentLang;
      // Re-render cards with new language
      renderCards();
    }

    // ── Stars ────────────────────────────────────────────────────────────────────
    (function() {
      const c = document.getElementById('stars');
      for (let i = 0; i < 55; i++) {
        const s = document.createElement('span');
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.5};`;
        c.appendChild(s);
      }
    })();

    // ── Asset maps ───────────────────────────────────────────────────────────────
    const HEAD_FILES = {
      pm:       'assets/product-manager/head-only.png',
      ux:       'assets/ux-designer/head.png',
      frontend: 'assets/frontend-dev/head.png',
      backend:  'assets/backend-dev/head.png',
      data:     'assets/data-scientist/head.png',
      qa:       'assets/qa-engineer/head.png',
      devops:   'assets/devops-engineer/head.png',
      security: 'assets/cybersec-engineer/head.png',
    };

    const BODY_FILES = {
      pm:       'assets/product-manager/full-body.png',
      ux:       'assets/ux-designer/full-body.png',
      frontend: 'assets/frontend-dev/full-body.png',
      backend:  'assets/backend-dev/full-body.png',
      data:     'assets/data-scientist/full-body.png',
      qa:       'assets/qa-engineer/full-body.png',
      devops:   'assets/devops-engineer/full-body.png',
      security: 'assets/cybersec-engineer/full-body.png',
    };

    // ── Render role cards ────────────────────────────────────────────────────────
    function renderCards() {
      const grid = document.getElementById('role-grid');
      const t = I18N[currentLang];
      grid.innerHTML = '';

      Object.values(ROLE_SCENARIOS).forEach((role, i) => {
        const char    = CHARACTERS[role.id];
        const strings = t.roles[role.id] || {};
        const card    = document.createElement('button');
        card.className = 'role-card';
        card.style.animationDelay = `${i * 0.07}s`;
        card.innerHTML = `
          <img class="role-card-sprite" src="${BODY_FILES[role.id]}" alt="${char.name}">
          <div class="role-card-body">
            <img class="role-card-head" src="${HEAD_FILES[role.id]}" alt="${char.name}">
            <div class="role-card-name">${char.name}</div>
            <div class="role-card-role">${strings.role  || char.role}</div>
            <div class="role-card-ws">${role.workstation.icon} ${strings.ws || role.workstation.label}</div>
            <div class="role-card-brief">${strings.brief || role.brief}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          State.reset();
          State.set({
            roleId:     role.id,
            sceneIndex: 0,
            metrics:    { quality: 100, security: 100, satisfaction: 100, cost: 0 },
            bobCount:   0, totalTasks: 0, timeSaved: 0,
            startedAt:  Date.now(), timerLeft: 600,
          });
          location.href = 'scene.html';
        });
        grid.appendChild(card);
      });
    }

    // ── Init ─────────────────────────────────────────────────────────────────────
    applyLang();
  </script>
</body>
</html>
